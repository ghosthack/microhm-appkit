name: Release

# Pushing a vX.Y.Z tag tests, builds, signs and publishes a GitHub Release with the DMG.
# Running the workflow by hand with publish=false is a dry run: everything but the release.
# Without the signing secrets the DMG holds an ad hoc signed app (fine for trying it, but
# Gatekeeper asks); with them it is signed with a Developer ID and notarized.
#   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD, MACOS_NOTARY_TEAM_ID
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version (X.Y.Z, X >= 1)
        required: true
        default: "1.0.0"
      publish:
        description: Publish a GitHub Release after packaging
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          if [[ ! "$tag" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be exactly vX.Y.Z with X >= 1 (got '$tag')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Reject publishing an existing version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; publish a higher X.Y.Z." >&2
            exit 1
          fi

  package:
    needs: metadata
    name: Test and package
    runs-on: macos-15
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the shared files
        run: scripts/sync-shared.sh --check
      - name: Run the Swift tests
        run: swift test
      - name: Test the phone page's script
        run: scripts/page-tests.sh
      - name: Test the phone page end to end
        run: scripts/phone-e2e.sh

      - name: Import the signing certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "No signing certificate configured; the app will be ad hoc signed."
            exit 0
          fi
          certificate="$RUNNER_TEMP/microhm-signing.p12"
          keychain="$RUNNER_TEMP/microhm-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$intermediate"
          intermediate_sha256="$(openssl x509 -inform DER -in "$intermediate" \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)"
          if [[ "$intermediate_sha256" != \
                F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A ]]; then
            echo "Unexpected Developer ID G2 intermediate fingerprint." >&2
            exit 1
          fi
          security add-certificates -k "$keychain" "$intermediate"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security list-keychains -d user -s "$keychain"
          valid_identity_count="$(security find-identity -v -p codesigning "$keychain" | \
            sed -n 's/^ *\([0-9][0-9]*\) valid identities found$/\1/p')"
          if [[ "$valid_identity_count" != "1" ]]; then
            echo "Expected exactly one valid macOS signing identity." >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$certificate" "$intermediate"

      - name: Build the app and the DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: scripts/package.sh "$RELEASE_VERSION"

      - name: Serve the phone page from the built app, without the build folder
        run: scripts/smoke-app.sh

      - name: Notarize and staple the DMG
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          if [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_PASSWORD" || -z "$NOTARY_TEAM_ID" ]]; then
            echo "No complete notarization credentials configured; skipping notarization."
            exit 0
          fi
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "Notarization credentials exist but MACOS_SIGNING_IDENTITY is missing." >&2
            exit 1
          fi
          shopt -s nullglob
          images=(dist/release/*.dmg)
          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one DMG to notarize." >&2
            exit 1
          fi
          submission="$RUNNER_TEMP/microhm-notary-submission.json"
          xcrun notarytool submit "${images[0]}" --wait \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --output-format json > "$submission"
          cat "$submission"
          submission_id="$(jq -r '.id // empty' "$submission")"
          submission_status="$(jq -r '.status // empty' "$submission")"
          if [[ "$submission_status" != "Accepted" ]]; then
            echo "Apple notarization failed with status: $submission_status" >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$NOTARY_APPLE_ID" \
                --password "$NOTARY_PASSWORD" \
                --team-id "$NOTARY_TEAM_ID" || true
            fi
            exit 1
          fi
          # Stapling fetches the ticket from Apple's CDN, and runner network drops are
          # common: retry before failing.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "${images[0]}" && xcrun stapler validate "${images[0]}"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "Stapling failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Stapling attempt $attempt failed; retrying in $((attempt * 30))s." >&2
            sleep $((attempt * 30))
          done
          spctl -a -t open --context context:primary-signature -v "${images[0]}"

      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove the temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN:-}" && -f "$MACOS_KEYCHAIN" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN"
          fi

  publish:
    needs: [metadata, package]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG appeared after validation; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Microhm for macOS $RELEASE_VERSION" \
            --generate-notes
